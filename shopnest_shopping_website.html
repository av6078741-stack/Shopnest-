<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopNest — Online Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#171717}button,input,select{font:inherit}button{cursor:pointer}
header{background:#111;color:#fff;position:sticky;top:0;z-index:20}.top{display:flex;align-items:center;gap:20px;padding:14px 5%;}.logo{font-size:25px;font-weight:900;white-space:nowrap}.logo span{color:#ffd23f}.search{flex:1;display:flex}.search input{width:100%;padding:12px 15px;border:0;border-radius:9px 0 0 9px}.search button{border:0;background:#ffd23f;padding:0 17px;border-radius:0 9px 9px 0}.headbtn{background:#222;border:1px solid #444;color:#fff;padding:10px 13px;border-radius:9px}.nav{display:flex;gap:8px;padding:0 5% 12px;overflow:auto}.nav button{background:transparent;color:#ddd;border:0;padding:8px 12px;white-space:nowrap}.nav button.active,.nav button:hover{background:#2a2a2a;border-radius:8px}
.hero{margin:22px 5%;padding:45px 6%;border-radius:22px;background:linear-gradient(120deg,#222,#3d3d3d);color:white}.hero h1{font-size:clamp(34px,6vw,60px);margin:0 0 10px}.hero p{color:#ddd}.shopbtn{background:#ffd23f;border:0;padding:13px 19px;border-radius:10px;font-weight:800}
.wrap{padding:0 5% 45px}.bar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 15px}.bar h2{margin:0}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:#fff;border-radius:17px;overflow:hidden;border:1px solid #e5e5e5;position:relative;transition:.2s}.product:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0001}.pic{height:210px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:85px}.info{padding:15px}.tag{font-size:12px;color:#777}.name{font-weight:800;margin:5px 0}.price{font-size:20px;font-weight:900}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:5px}.add{width:100%;margin-top:11px;padding:11px;border:0;background:#111;color:#fff;border-radius:9px;font-weight:800}.heart{position:absolute;right:10px;top:10px;border:0;background:#fff;border-radius:50%;width:35px;height:35px;font-size:19px}.heart.on{color:#e63946}
.drawer{position:fixed;right:-420px;top:0;width:min(400px,94vw);height:100%;background:#fff;z-index:40;box-shadow:-10px 0 35px #0002;padding:22px;transition:.3s;overflow:auto}.drawer.open{right:0}.drawerHead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:8px;padding:8px 12px}.cartitem{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #eee}.emoji{font-size:38px}.qty button{border:1px solid #ddd;background:#fff;width:28px;height:28px;border-radius:6px}.total{font-size:22px;font-weight:900;margin:20px 0}.checkout{width:100%;padding:14px;border:0;background:#111;color:#fff;border-radius:10px;font-weight:800}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;max-width:520px;width:100%;padding:25px}.modalbox input,.modalbox select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px}.success{padding:15px;background:#eaf8ee;border-radius:10px;margin-top:10px}
footer{background:#111;color:#bbb;text-align:center;padding:28px}
@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}.products{grid-template-columns:repeat(2,1fr)}.pic{height:160px;font-size:65px}.hero{margin:15px 3%;padding:30px 7%}.wrap{padding:0 3% 35px}}@media(max-width:400px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="top"><div class="logo">SHOP<span>NEST</span></div><div class="search"><input id="search" placeholder="Search products..." oninput="render()"><button>🔍</button></div><button class="headbtn" onclick="openCart()">🛒 Cart (<b id="count">0</b>)</button></div>
<div class="nav" id="cats"></div>
</header>

<section class="hero"><h1>Big deals.<br>Better shopping.</h1><p>Discover everyday essentials, fashion, gadgets and more — all in one place.</p><button class="shopbtn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now →</button></section>

<main class="wrap"><div class="bar"><h2 id="heading">Featured Products</h2><select id="sort" onchange="render()" style="padding:10px;border:1px solid #ddd;border-radius:9px"><option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select></div><div class="products" id="products"></div></main>

<div class="drawer" id="drawer"><div class="drawerHead"><h2>🛒 Your Cart</h2><button class="close" onclick="closeCart()">✕</button></div><div id="cartItems"></div><div class="total">Total: <span id="total">₹0</span></div><button class="checkout" onclick="checkout()">Proceed to Checkout</button></div>

<div class="modal" id="modal"><div class="modalbox"><div class="drawerHead"><h2>Checkout</h2><button class="close" onclick="closeModal()">✕</button></div><div id="checkoutForm"><input id="buyer" placeholder="Full name"><input id="phone" placeholder="Mobile number"><input id="address" placeholder="Delivery address"><select id="payment"><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select><button class="checkout" onclick="placeOrder()">Place Order</button></div><div id="orderDone"></div></div></div>
<footer>© 2026 ShopNest • Demo Shopping Store</footer>

<script>
const products=[
{id:1,n:'Classic Sneakers',cat:'Fashion',p:1499,old:2199,e:'👟'}, {id:2,n:'Minimal Backpack',cat:'Fashion',p:899,old:1299,e:'🎒'},
{id:3,n:'Wireless Headphones',cat:'Electronics',p:1999,old:2999,e:'🎧'}, {id:4,n:'Smart Watch',cat:'Electronics',p:2499,old:3999,e:'⌚'},
{id:5,n:'Cotton Hoodie',cat:'Fashion',p:999,old:1499,e:'🧥'}, {id:6,n:'Desk Lamp',cat:'Home',p:699,old:999,e:'💡'},
{id:7,n:'Coffee Mug',cat:'Home',p:349,old:499,e:'☕'}, {id:8,n:'Bluetooth Speaker',cat:'Electronics',p:1299,old:1799,e:'🔊'},
{id:9,n:'Sunglasses',cat:'Fashion',p:599,old:899,e:'🕶️'}, {id:10,n:'Travel Bottle',cat:'Home',p:449,old:699,e:'🧴'},
{id:11,n:'Gaming Mouse',cat:'Electronics',p:799,old:1199,e:'🖱️'}, {id:12,n:'Notebook Set',cat:'Stationery',p:299,old:399,e:'📒'}
];
let cat='All',cart={},wish=new Set();
const money=n=>'₹'+n.toLocaleString('en-IN');
function setup(){let cs=['All',...new Set(products.map(x=>x.cat))];cats.innerHTML=cs.map(x=>`<button class="${x==='All'?'active':''}" onclick="setCat('${x}',this)">${x}</button>`).join('');render()}
function setCat(x,b){cat=x;document.querySelectorAll('.nav button').forEach(y=>y.classList.remove('active'));b.classList.add('active');heading.textContent=x==='All'?'Featured Products':x;render()}
function render(){let q=search.value.toLowerCase();let a=products.filter(x=>(cat==='All'||x.cat===cat)&&x.n.toLowerCase().includes(q));if(sort.value==='low')a.sort((x,y)=>x.p-y.p);if(sort.value==='high')a.sort((x,y)=>y.p-x.p);productsEl.innerHTML=a.map(x=>`<article class="product"><button class="heart ${wish.has(x.id)?'on':''}" onclick="toggleWish(${x.id})">♥</button><div class="pic">${x.e}</div><div class="info"><div class="tag">${x.cat}</div><div class="name">${x.n}</div><div class="price">${money(x.p)} <span class="old">${money(x.old)}</span></div><button class="add" onclick="add(${x.id})">Add to Cart</button></div></article>`).join('')||'<p>No products found.</p>'}
const productsEl=document.getElementById('products');
function add(id){cart[id]=(cart[id]||0)+1;updateCart();openCart()}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];updateCart()}
function updateCart(){let ids=Object.keys(cart),num=ids.reduce((s,id)=>s+cart[id],0),tot=ids.reduce((s,id)=>s+cart[id]*products.find(x=>x.id==id).p,0);count.textContent=num;total.textContent=money(tot);cartItems.innerHTML=ids.map(id=>{let x=products.find(y=>y.id==id);return `<div class="cartitem"><div class="emoji">${x.e}</div><div style="flex:1"><b>${x.n}</b><div>${money(x.p)}</div><div class="qty"><button onclick="change(${id},-1)">−</button> ${cart[id]} <button onclick="change(${id},1)">+</button></div></div></div>`}).join('')||'<p>Your cart is empty.</p>'}
function openCart(){drawer.classList.add('open')}function closeCart(){drawer.classList.remove('open')}
function toggleWish(id){wish.has(id)?wish.delete(id):wish.add(id);render()}
function checkout(){if(!Object.keys(cart).length){alert('Cart is empty!');return}modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}
function placeOrder(){if(!buyer.value||!phone.value||!address.value){alert('Please fill all details.');return}let order='SN'+Math.floor(100000+Math.random()*900000);checkoutForm.style.display='none';orderDone.innerHTML=`<div class="success"><h3>🎉 Order placed!</h3><p>Thank you, <b>${buyer.value}</b>.</p><p>Your demo order ID is <b>${order}</b>.</p></div>`;cart={};updateCart();closeCart()}
setup();updateCart();
</script>
</body></html>
